{% extends 'base.html' %}

{% block title %}Login | {{ app_title }}{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand-icon">₹</div>
      <h2 style="font-size: 1.55rem; font-weight: 800; color: var(--gray-900); letter-spacing: -0.02em;">{{ app_title }}</h2>
      <p style="font-size: 0.9rem; font-weight: 500; color: var(--primary); font-style: italic; margin-top: 0.2rem;">
        "{{ app_tagline }}"
      </p>
      <p style="font-size: 0.825rem; color: var(--text-muted); margin-top: 0.45rem;">
        Sign in to manage and analyze your personal expenses
      </p>
    </div>

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      
      <div class="form-group" style="margin-bottom: 1.15rem;">
        <label class="form-label" for="id_username">Username</label>
        <input 
          type="text" 
          name="username" 
          id="id_username" 
          class="form-control" 
          required 
          autofocus 
          placeholder="Enter username"
        >
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label" for="id_password">Password</label>
        <input 
          type="password" 
          name="password" 
          id="id_password" 
          class="form-control" 
          required 
          placeholder="Enter password"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem;">
        Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
