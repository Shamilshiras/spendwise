services:
  - type: web
    name: spendwise
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: TIME_ZONE
        value: "Asia/Kolkata"
      - key: ADMIN_USER
        value: "admin"
      - key: ADMIN_PASS
        value: "admin123"
