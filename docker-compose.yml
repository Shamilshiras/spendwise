services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: expense_tracker
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py init_app &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_ENGINE=mysql
      - DB_NAME=expense_tracker
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_HOST=db
      - DB_PORT=3306
      - USE_MYSQL=True
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - TIME_ZONE=Asia/Kolkata
    depends_on:
      - db

volumes:
  mysql_data:
